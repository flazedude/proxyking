[package]
name = "proxyking"
version = "0.4.0"
description = "ProxyKing — a personal proxy client"
authors = ["ProxyKing"]
edition = "2021"
rust-version = "1.90"
default-run = "proxyking"

[lib]
name = "proxyking_lib"
# The Windows desktop binary links the Rust library directly. Mobile packaging
# will add staticlib/cdylib when its native VPN adapters are implemented.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.14"
tokio = { version = "1", features = ["net", "time"] }
regex = "1"
semver = "1"
futures-util = "0.3"
minisign-verify = "0.3"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["blocking"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.14.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Com", "Win32_System_Registry", "Win32_Networking_WinInet", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
